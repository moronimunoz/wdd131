<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto&family=Playfair+Display:wght@700&family=Poppins:wght@400;500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="styles/styles.css">
  <link rel="stylesheet" href="styles/temple.css">
  <link rel="stylesheet" href="styles/nav-dyscon.css">

  <title>Agujero negro ASCII · fondo</title>
  <script src="scripts/blackhole.js" defer></script>
  <script src="scripts/temples.js" defer></script>
  <script src="scripts/nav-dyscon.js" defer></script>
</head>

<body>

  <div id="bh" aria-hidden="true">
    <canvas id="bh-main"></canvas>
    <canvas id="bh-glow"></canvas>
  </div>

  <!-- ÍCONOS -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-flecha" viewBox="0 0 24 24">
      <path d="M5 12h14M13 6l6 6-6 6" />
    </symbol>
  </svg>

  <!-- HEADER (nav estilo DyScon: transparente arriba, blanco al bajar) -->
  <header class="header header--hero" id="header">
    <a href="#" class="logo" aria-label="Temple Album - Home">
      <img src="logo.png" alt="" width="50" height="50">
      <span class="logo-texto">Temple Album</span>
    </a>

    <button class="menu-toggle" aria-label="Abrir menú" aria-expanded="false">☰</button>

    <nav class="nav" id="nav" aria-label="Principal">
      <a href="#" class="activo">Home</a>
      <a href="#">Old</a>
      <a href="#">New</a>
      <a href="#">Large</a>
      <a href="#">Small</a>
    </nav>
  </header>

  <main>
    <h1 class="album-title">Home</h1>
    <section class="album-list">
      <figure class="album-item">
        <img src="../../images/buenos-aires-argentina-temple-4087-main.jpg" alt="Buenos Aires Argentina Temple"
          loading="lazy" width="400" height="250">
        <figcaption>Buenos Aires Argentina Temple</figcaption>
      </figure>
      <figure class="album-item">
        <img src="../../images/belem-brazil-temple-31310-main.jpg" alt="Belem Brazil Temple" loading="lazy" width="400"
          height="250">
        <figcaption>Belem Brazil Temple</figcaption>
      </figure>
      <figure class="album-item">
        <img src="../../images/greenville-south-carolina-temple-71624-main.jpg" alt="Greenville South Carolina Temple"
          loading="lazy" width="400" height="250">
        <figcaption>Greenville South Carolina Temple</figcaption>
      </figure>
      <figure class="album-item">
        <img src="../../images/recife-brazil-temple-36778-main.jpg" alt="Recife Brazil Temple" loading="lazy"
          width="400" height="250">
        <figcaption>Recife Brazil Temple</figcaption>
      </figure>
      <figure class="album-item">
        <img src="../../images/salt-lake-temple-75244-main.jpg" alt="Salt Lake Temple" loading="lazy" width="400"
          height="250">
        <figcaption>Salt Lake Temple</figcaption>
      </figure>
      <figure class="album-item">
        <img src="../../images/stockholm-sweden-temple-30267-main.jpg" alt="Stockholm Sweden Temple" loading="lazy"
          width="400" height="250">
        <figcaption>Stockholm Sweden Temple</figcaption>
      </figure>
      <figure class="album-item">
        <img src="../../images/columbus-ohio-temple-57341-main.jpg" alt="Columbus Ohio Temple" loading="lazy"
          width="400" height="250">
        <figcaption>Columbus Ohio Temple</figcaption>
      </figure>
      <figure class="album-item">
        <img src="../../images/cordoba-argentina-temple-11093-main.jpg" alt="Cordoba Argentina Temple" loading="lazy"
          width="400" height="250">
        <figcaption>Cordoba Argentina Temple</figcaption>
      </figure>
      <figure class="album-item">
        <img src="../../images/birmingham-alabama-temple-21774-main.jpg" alt="Birmingham Alabama Temple" loading="lazy"
          width="400" height="250">
        <figcaption>Birmingham Alabama Temple</figcaption>
      </figure>
    </section>
  </main>

  <footer>
    <p>&copy; <span id="currentyear"></span>. Moroni Muñoz. Argentina.</p>
    <p id="lastModified"></p>
  </footer>
</body>

</html>
